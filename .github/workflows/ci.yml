name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore HealthCareSystem.sln

      - name: Build solution
        run: dotnet build HealthCareSystem.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test HealthCareSystem.sln --configuration Release --no-build --no-restore
